[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lpie"
version = "0.1.0"
description = "Loan Performance Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Intain Hackathon Team" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
